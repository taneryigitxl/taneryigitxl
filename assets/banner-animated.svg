<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-labelledby="title desc">
<title id="title">Taner Yiğit — IT Operations and Software Development</title>
<desc id="desc">Animated navy technology profile banner with a geometric TY monogram, blue and violet light trails, network motifs and a quiet moving signal.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080E1B"/><stop offset=".55" stop-color="#101B30"/><stop offset="1" stop-color="#0A1120"/></linearGradient>
<linearGradient id="accent"><stop stop-color="#38BDF8"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient>
<linearGradient id="fade"><stop stop-color="#38BDF8" stop-opacity="0"/><stop offset=".5" stop-color="#38BDF8" stop-opacity=".55"/><stop offset="1" stop-color="#38BDF8" stop-opacity="0"/></linearGradient>
<pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M 42 0 L 0 0 0 42" fill="none" stroke="#6DA8FF" stroke-opacity=".075" stroke-width="1"/></pattern>
<clipPath id="frame"><rect x="0" y="0" width="1200" height="350" rx="18"/></clipPath>
</defs>
<g clip-path="url(#frame)">
<rect width="1200" height="350" fill="url(#bg)"/>
<rect width="1200" height="350" fill="url(#grid)"/>
<ellipse cx="1080" cy="290" rx="350" ry="190" fill="#6633CC" opacity=".09"/>
<ellipse cx="380" cy="20" rx="350" ry="150" fill="#149DD1" opacity=".08"/>
<path d="M0 275 Q170 235 335 275 T660 260 T1200 250" stroke="#38BDF8" opacity=".18" fill="none" stroke-width="1.5"/>
<path d="M650 0 Q890 110 1200 40" stroke="#8B5CF6" opacity=".22" fill="none" stroke-width="2"/>
<g opacity=".6" fill="none" stroke="#38BDF8" stroke-width="1.2">
<path d="M930 86H1020L1050 116H1140"/><path d="M930 134H990L1012 156H1150"/><path d="M900 232H1030L1050 212H1160"/>
</g>
<g fill="#38BDF8"><circle cx="930" cy="86" r="3"><animate attributeName="opacity" values=".2;1;.2" dur="3.3s" repeatCount="indefinite"/></circle><circle cx="1140" cy="116" r="3"/><circle cx="930" cy="134" r="3"/><circle cx="1150" cy="156" r="3"><animate attributeName="opacity" values="1;.2;1" dur="4s" repeatCount="indefinite"/></circle><circle cx="900" cy="232" r="3"/><circle cx="1160" cy="212" r="3"/></g>
<g transform="translate(72 70)">
<circle cx="105" cy="105" r="101" stroke="url(#accent)" stroke-width="2" fill="#0F1A2C" fill-opacity=".68" stroke-dasharray="198 26 85 38 150 42 20 100">
<animateTransform attributeName="transform" type="rotate" from="0 105 105" to="360 105 105" dur="32s" repeatCount="indefinite"/>
</circle>
<path d="M51 69H164L146 91H118V163H91V91H69Z" fill="#F1F5F9"/>
<path d="M120 165L173 49H196L145 165Z" fill="url(#accent)"/>
<path d="M82 189H171" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
</g>
<path d="M330 75V267" stroke="url(#accent)" stroke-width="2" opacity=".65"/>
<text x="370" y="132" fill="#F1F5F9" font-family="Arial,Helvetica,sans-serif" font-size="55" font-weight="750" letter-spacing="3">TANER <tspan fill="#38BDF8">YİĞİT</tspan></text>
<text x="372" y="175" fill="#BAC8DB" font-family="Arial,Helvetica,sans-serif" font-size="19" letter-spacing="3">IT OPERATIONS  /  SOFTWARE DEVELOPMENT</text>
<g font-family="Arial,Helvetica,sans-serif" font-size="14" letter-spacing="1">
<rect x="370" y="206" width="148" height="37" rx="18" fill="#38BDF8" fill-opacity=".11" stroke="#38BDF8" stroke-opacity=".36"/><text x="393" y="230" fill="#8FDBFC">INFRASTRUCTURE</text>
<rect x="529" y="206" width="125" height="37" rx="18" fill="#8B5CF6" fill-opacity=".12" stroke="#8B5CF6" stroke-opacity=".40"/><text x="553" y="230" fill="#C5B4FD">DEVELOPMENT</text>
<rect x="666" y="206" width="101" height="37" rx="18" fill="#38BDF8" fill-opacity=".1" stroke="#38BDF8" stroke-opacity=".3"/><text x="688" y="230" fill="#8FDBFC">GAMING</text>
</g>
<text x="372" y="284" font-family="monospace" fill="#91A5BF" font-size="17" letter-spacing="2">github.com/taneryigitxl</text>
<rect x="-300" y="314" width="300" height="2" fill="url(#fade)">
<animate attributeName="x" values="-300;1200" dur="7s" repeatCount="indefinite"/>
</rect>
<rect x="0.5" y=".5" width="1199" height="349" rx="17.5" stroke="#6BA5DE" stroke-opacity=".24" fill="none"/>
</g></svg>